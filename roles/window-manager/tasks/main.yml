---
- name: Include distribution and version-specific vars.
  include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
      skip: true

- name: Ensure community.general collection is available (for COPR support)
  ansible.builtin.command:
    cmd: ansible-galaxy collection install community.general
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  when: ansible_distribution == "Fedora"

- name: Enable Hyprland COPR repository
  community.general.copr:
    name: sdegler/hyprland
    state: enabled
  when: ansible_distribution == "Fedora"

- name: Install window manager & packages
  package:
    name: "{{ item.name }}"
    state: "{{ item.state}}"
  with_items: "{{ window_manager_packages }}"

- name: Install window manager aur packages
  kewlfft.aur.aur:
    use: yay
    name: "{{ item.name }}"
    state: "{{ item.state}}"
  with_items: "{{ window_manager_aur_packages }}"
  become_user: "{{username}}"
